<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1b3c">
<meta name="robots" content="noindex,nofollow">
<title>Affinity Universe Tutorial (Class)</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  color:#fff;display:flex;align-items:center;justify-content:center;padding:32px 20px;min-height:100dvh;
  background:
    radial-gradient(ellipse at 50% 51%,rgba(46,85,175,.28) 0%,rgba(46,85,175,.09) 35%,transparent 73%),
    radial-gradient(circle at 9% 15%,rgba(42,84,177,.17),transparent 30%),
    radial-gradient(circle at 88% 90%,rgba(40,68,145,.14),transparent 32%),
    linear-gradient(155deg,#0c1b3c 0%,#102144 52%,#081632 100%);
}
main{width:min(100%,760px);text-align:center}
.badge{color:#a7c5ff;font-size:clamp(11px,1.15vw,14px);font-weight:800;letter-spacing:.18em;margin:0 0 18px}
h1{margin:0;font-size:clamp(34px,5vw,58px);font-weight:800;line-height:1.17;letter-spacing:-.045em;word-break:keep-all}
.sub{margin:18px auto 0;color:#cbd9f3;font-size:clamp(15px,1.5vw,19px);line-height:1.65;word-break:keep-all}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:clamp(36px,6vh,56px) auto 0;max-width:620px}
a.lang{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:190px;padding:26px 18px;
  border-radius:24px;text-decoration:none;color:#fff;
  background:rgba(255,255,255,.05);border:1px solid rgba(151,182,228,.38);
  transition:transform .18s ease,background .18s ease,border-color .18s ease,box-shadow .18s ease;
}
a.lang:hover,a.lang:focus-visible{transform:translateY(-3px);background:rgba(18,102,255,.18);border-color:#60a5ff;box-shadow:0 14px 36px rgba(0,60,180,.35);outline:none}
.icon{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:26px;font-weight:900;background:linear-gradient(90deg,#1266ff,#3490ff)}
.lang strong{font-size:24px;font-weight:800;letter-spacing:-.02em}
.lang small{color:#a9bde0;font-size:14px;font-weight:600}
footer{margin-top:40px;color:rgba(255,255,255,.45);font-size:12px}
@media(max-width:520px){.choices{grid-template-columns:1fr}a.lang{min-height:150px}}
</style>
</head>
<body>
<main>
  <p class="badge">AFFINITY UNIVERSE · CLASS</p>
  <h1>어피니티 디자인 튜토리얼</h1>
  <p class="sub">언어를 선택하세요. &nbsp;/&nbsp; Choose your language.</p>
  <nav class="choices" aria-label="언어 선택 / Language">
    <a class="lang" href="./tutorial.html" lang="ko">
      <span class="icon" aria-hidden="true">가</span>
      <strong>한국어</strong>
      <small>국문 튜토리얼 시작하기</small>
    </a>
    <a class="lang" href="./tutorial_en.html" lang="en">
      <span class="icon" aria-hidden="true">A</span>
      <strong>English</strong>
      <small>Start the English tutorial</small>
    </a>
  </nav>
  <footer>© 2026 Affinity Universe</footer>
</main>
</body>
</html>
